name: Deploy to WordPress.org
on:
  release:
    # `released`, NOT `published`. GitHub fires `published` for a pre-release
    # too — which the guard below then skips — and fires nothing this workflow
    # listens for when that pre-release is later promoted. So the documented
    # release procedure (pre-release, field check, promote) shipped NOTHING to
    # WordPress.org, silently: no run appeared at all, and the only signal was
    # the wp.org API still reporting the previous version.
    #
    # `released` means "a release was published, or a pre-release was changed
    # to a release" — both paths, and never a pre-release. It also cannot
    # double-fire the way [published, released] would for a release published
    # straight to stable.
    types: [released]

# Least privilege: the job only checks out the repo and deploys to WordPress.org
# SVN using SVN_USERNAME/SVN_PASSWORD secrets — it never writes back via GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    # Skip pre-releases (beta, rc, alpha) — only stable releases ship to WP.org SVN.
    if: github.event.release.prerelease == false
    steps:
      - uses: actions/checkout@v5

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: digitizer-site-worker
          BUILD_DIR: digitizer-site-worker
          ASSETS_DIR: .wordpress-org
